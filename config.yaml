# ==================== 输入与基因标识 ====================
input:
  gene_identity_mode: gtf_gene_id
  annotation_gtf: "/home/huangtao/Desktop/huangchengqi/reference_documents/refdata-cellranger-arc-GRCh38-2024-A/genes/genes.gtf.gz"
  rna_gene_id_column: gene_ids
  rna_h5ad: "/home/huangtao/Desktop/huangchengqi/test/output/rna_adata.h5ad"
  atac_h5ad: "/home/huangtao/Desktop/huangchengqi/test/output/atac_adata.h5ad"
  genome_fasta: "/home/huangtao/Desktop/huangchengqi/reference_documents/refdata-cellranger-arc-GRCh38-2024-A/fasta/genome.fa"  # motif 扫描参考基因组
  target_genes: "/home/huangtao/Desktop/huangchengqi/code_1/CausalBridge/target_genes.txt"  # 每行一个 KO 目标基因

# ==================== 预处理：质控、参考视图与模型视图 ====================
preprocess:
  rna:
    min_cells_per_gene: 50                  # 基因最少检出细胞数
    min_umi_per_cell: 500                   # 细胞最少 UMI 数
    n_highly_variable_genes: 3000           # 高变基因数
  atac:
    min_cells_per_peak: 10                  # peak 最少开放细胞数
    min_peaks_per_cell: 1000                # 细胞最少开放 peak 数
    binarize: true                         # 质控与参考视图使用二值 ATAC
  # 连续模型视图仅用于 saturating_hybrid；启用后覆盖模型 ATAC 视图，参考质控仍为二值。
  atac_depth_normalization:
    enabled: true
    target_sum: 10000.0                     # 深度分母为原始完整输入的 peak 计数总和
    output_cap_expansion: 0.25              # 归一化 ATAC log1p 单位下扩展 WT 跨度的 25%，不是原始概率

# ==================== 细胞聚类与谱系 ====================
clustering:
  enabled: true
  cluster_key: "leiden"                     # obs 聚类标签列
  n_neighbors: 20
  n_pcs: 20
  resolution: 0.5                          # Leiden 分辨率
  random_state: 42
  min_cells_per_cluster: 50                 # 低于此细胞数时回退
  fallback_pseudotime_method: "palantir"     # 全局回退方法
  paga:
    enabled: false                         # 启用后按 PAGA 连通性合并谱系
    connectivity_threshold: 0.08
    min_cells_per_lineage: 50

# R、R 包和原生依赖统一安装在 CausalBridge conda 环境中。
cytotrace:
  rscript_binary: "/home/huangtao/miniconda3/envs/CausalBridge/bin/Rscript"
  r_library_dir: "/home/huangtao/miniconda3/envs/CausalBridge/lib/R/library"
  native_library_dir: "/home/huangtao/miniconda3/envs/CausalBridge/lib"

# ==================== 伪时间与分箱 ====================
pseudotime:
  method: "dpt"                            # dpt | palantir
  n_neighbors: 20
  root_cell_marker: null                    # 根细胞标记基因；null 为自动推断
  root_cell_method: "cytotrace"             # cytotrace | marker | min_umi | auto
  cytotrace_n_top_genes: 200
  n_bins: 50                               # 分箱数上限
  min_cells_per_bin: 10                     # 每箱目标细胞数
  smooth_kernel: "gaussian"                 # gaussian 软分箱 | hard 硬分箱
  smooth_overlap_factor: 2.0                # 高斯 sigma 上限相对于箱宽的倍数
  ablation_shuffle_pseudotime: false        # 消融：打乱伪时间
  adaptive_binning:
    enabled: false
    bandwidth_selection: state             # 带宽依据有效样本量，不依据状态分数
    boundary: split_noise                  # 状态边界保护；none 为仅按有效样本量分箱
    state_modality: rna                    # 仅用于状态判定；伪时间仍使用联合 RNA+ATAC 主成分
    embedding:
      n_components: 5
      max_features: 512
      max_dense_elements: 2000000
      random_seed: 42

# ==================== Granger 调控边筛选 ====================
granger:
  distance_thresh: 200000                   # peak–gene 最大距离，单位 bp
  significance_threshold: 0.01              # 调控边 F 检验阈值，不是最终扰动显著性阈值
  correction_method: "fdr_bh"
  min_effect_size: 0.1                      # 最小 ΔR²
  soft_threshold: true                     # 使用复合分数筛选
  min_composite_score: 0.3
  composite_weights: [0.4, 0.6]             # [校正 p 值权重, 效应量权重]
  max_lag: 1
  reference_bins: 50                       # 自由度校正的参考分箱数
  ablation_lag0: false                      # 消融：仅使用同期关系

# ==================== ATAC→RNA：流程与响应模型 ====================
atac_to_rna:
  # saturating_hybrid 使用单关系/支持组流程；两层 response_model 独立选择。
  model_mode: saturating_hybrid
  response_model: nn                   # 当前层响应：spline | nn | saturation
  # 实验性绿色试验参数；smoothness=1e-6 尚非验证最优值，不在生产内逐关系 CV。
  spline_response:
    smoothness: 1.0e-6
    group_interaction_penalty: 0.01          # 2/3输入组交互系数惩罚，实验性默认
    tail_scale: 0.5
    internal_knots: 2
    max_nfev: 1000
    restarts: 3
    seed: 42
  log_normalize_rna: true                   # RNA 使用 log1p 归一化

  # 仅当前层 response_model=nn：独立 NN 训练预算。
  nn_response:
    hidden_width: 4
    epochs: 300
    lr: 0.01
    l2: 0.01
    seed: 42
    restarts: 1                            # NN 重启次数，与下方饱和拟合起点数独立

  # 仅 saturating_hybrid：两层共享的拟合与支持组参数。
  saturating_hybrid:
    workers: 24                            # 所有拟合阶段的目标进程数
    max_nfev: 500                           # 仅 saturation 响应的求解预算
    budget_exhausted_policy: best_finite    # 饱和求解耗尽预算后保留有效有限候选
    det_starts: 3                          # 饱和拟合确定性起点数，不控制 NN 重启
    rna_cap_lambda: 0.25                   # RNA 输出上限扩展 WT 跨度的比例
    min_fit_rows: 12
    group_sizes: [2, 3]
    max_groups: 2
    polynomial_degree: 2
    ridge: 0.1
    min_group_rows: 24
    min_group_cell_ess: 30.0
    min_query_cell_ess: 10.0
    min_group_effective_rows: 12.0
    max_geometry_condition: 10000.0
    support_radius_quantile: 0.95
    min_penalized_gain: 0.05
    restart_prediction_spread_max: 0.05
    query_neighbors: 10

# ==================== RNA→ATAC：响应模型与调控边 ====================
rna_to_atac:
  response_model: spline                   # 当前层响应：spline | nn | saturation；两层独立
  spline_response:
    smoothness: 1.0e-6                     # 实验性默认，不代表已验证最优
    group_interaction_penalty: 0.01          # 2/3输入组交互系数惩罚
    tail_scale: 0.5
    internal_knots: 2
    max_nfev: 1000
    restarts: 3
    seed: 42
  # 仅当前层 response_model=nn；当前为 spline，保留供切换比较。
  nn_response:
    hidden_width: 4
    epochs: 300
    lr: 0.01
    l2: 0.01
    seed: 42
    restarts: 1
  motif_db: "jaspar2024"
  motif_scan_workers: 24                    # motif 缺失扫描进程数
  motif_pval_threshold: 0.1                 # motif 候选粗筛阈值
  max_tfs_per_peak: 5
  tf_peak_pvalue_threshold: 0.05            # TF→peak Pearson 边筛选阈值，不是扰动显著性阈值
  min_abs_contribution: 0.01                # 最小 |weight| × std(X)
  tf_expression_filter: true               # 验证 TF 是否在 RNA 矩阵中
  time_lag: true                           # 逐 lag 独立检验，取第一个显著 lag
  max_lag: "auto"                          # auto/0/负数按 n_bins//4；关闭 time_lag 时仅使用 lag=0

# ==================== 扰动传播与结果汇总 ====================
perturbation:
  knockout_type: "gene"                     # gene | peak
  perturbation_mode: "bin_forward"
  joint_knockout: true                      # 联合敲除所有目标基因；false 为逐基因模拟
  ko_strength: 1.0                         # 1.0 为完全敲除
  propagation_rounds: 1
  subnetwork_depth: unlimited
  subnetwork_unlimited_max_edges: 250000    # 最终模拟边数上限
  subnetwork_unlimited_max_work_edges: 250000  # 闭包遍历候选行上限
  min_r2_threshold: 0.3                    # peak→gene 边的最低 R²
  min_lag_per_peak_filter: true             # 每个 peak 保留最小 lag 的 TF
  log_accumulation: true                    # 在 log1p 空间累加；false 使用历史 raw 累加
  min_delta_threshold: 0                    # 输出 |log2FC| 阈值；0 为不过滤
  atac_significance_zscore: 2.0             # ATAC 扰动显著性：|变化量| / WT 箱间标准差
  aggregation_policy: valid_cell_means      # 同一有效细胞子集的 WT/扰后均值按细胞数加权，再计算 log2 比值
  cell_projection:
    enabled: true                          # 启用 RNA 参考投影
    n_components: null                     # 保留所有可估计的 PCA 主成分
    n_neighbors: 20
    history_delta_threshold: 1.0e-8        # 稀疏历史变化量的非零阈值
    state_unit: rna_log1p_cp10k
  # 仅 knockout_type=peak：读取此段，不使用 target_genes。
  peak_ko:
    peak_id: "chr3:34,691,323–34,693,322"
    mode: relative                         # relative: A'=A(1+s)；absolute: A'=s
    strength: -1.0                         # -1 完全关闭，+1 增强
    state: "all"                           # 簇标签或 all
    depth: 2                               # 1 为直接靶基因；2/3 为级联传播
    match: overlap                         # exact | overlap | nearest

# ==================== 输出与缓存 ====================
output:
  dir: "/home/huangtao/Desktop/huangchengqi/code_1/CausalBridge/results/test/MYB_test/"
  cache_dir: "/home/huangtao/Desktop/huangchengqi/code_1/CausalBridge/cache_test/"
  checkpoint_dir: null                     # null 使用 output.dir/checkpoints
  save_intermediate: true
