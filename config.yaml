# ==================== Inputs and gene identity ====================
input:
  gene_identity_mode: gtf_gene_id
  annotation_gtf: "/reference/GRCh38/genes.gtf.gz"
  rna_gene_id_column: gene_ids
  rna_h5ad: "/data/human/rna_adata.h5ad"
  atac_h5ad: "/data/human/atac_adata.h5ad"
  genome_fasta: "/reference/GRCh38/genome.fa"  # Reference genome for motif scanning
  target_genes: "target_genes.txt"  # One KO target gene per line

# ==================== Preprocessing: QC, reference and model views ====================
preprocess:
  rna:
    min_cells_per_gene: 50                  # Minimum cells detecting each gene
    min_umi_per_cell: 500                   # Minimum UMIs per cell
    n_highly_variable_genes: 3000           # Number of highly variable genes
  atac:
    min_cells_per_peak: 10                  # Minimum cells with each accessible peak
    min_peaks_per_cell: 1000                # Minimum accessible peaks per cell
    binarize: true                         # Binary ATAC for QC and reference views
  # Continuous model view for saturating_hybrid only; reference QC remains binary.
  atac_depth_normalization:
    enabled: true
    target_sum: 10000.0                     # Depth denominator: all peaks in the original complete input
    output_cap_expansion: 0.25              # Expand WT span by25% in normalized ATAC log1p units, not raw probabilities

# ==================== Cell clustering and lineages ====================
clustering:
  enabled: true
  cluster_key: "leiden"                     # Cluster-label column in obs
  n_neighbors: 20
  n_pcs: 20
  resolution: 0.5                          # Leiden resolution
  random_state: 42
  min_cells_per_cluster: 50                 # Fallback below this cell count
  fallback_pseudotime_method: "palantir"     # Global fallback method
  paga:
    enabled: false                         # Merge lineages by PAGA connectivity when enabled
    connectivity_threshold: 0.08
    min_cells_per_lineage: 50

# Install R, R packages and native dependencies in the same CausalBridge conda environment.
cytotrace:
  rscript_binary: "Rscript"

# ==================== Pseudotime and binning ====================
pseudotime:
  method: "dpt"                            # dpt | palantir
  n_neighbors: 20
  root_cell_marker: null                    # Root marker genes; null infers automatically
  root_cell_method: "cytotrace"             # cytotrace | marker | min_umi | auto
  cytotrace_n_top_genes: 200
  n_bins: 50                               # Maximum bin count
  min_cells_per_bin: 10                     # Target cells per bin
  smooth_kernel: "gaussian"                 # gaussian soft binning | hard binning
  smooth_overlap_factor: 2.0                # Maximum Gaussian sigma as a multiple of bin width
  ablation_shuffle_pseudotime: false        # Ablation: shuffled pseudotime
  adaptive_binning:
    enabled: false
    bandwidth_selection: state             # Bandwidth based on effective sample size rather than state score
    boundary: split_noise                  # Protect state boundaries; none uses effective sample size only
    state_modality: rna                    # State decisions only; pseudotime still uses joint RNA+ATAC PCs
    embedding:
      n_components: 5
      max_features: 512
      max_dense_elements: 2000000
      random_seed: 42

# ==================== Granger regulatory-edge screening ====================
granger:
  distance_thresh: 200000                   # Maximum peak–gene distance in bp
  significance_threshold: 0.01              # Edge F-test threshold, not final perturbation significance
  correction_method: "fdr_bh"
  min_effect_size: 0.1                      # Minimum partial Delta R²
  soft_threshold: true                     # Composite-score filtering
  min_composite_score: 0.3
  composite_weights: [0.4, 0.6]             # [adjusted-p weight, effect-size weight]
  max_lag: 1
  reference_bins: 50                       # Reference bin count for degrees-of-freedom correction
  ablation_lag0: false                      # Ablation: contemporaneous relationships only

# ==================== ATAC→RNA pipeline and response models ====================
atac_to_rna:
  single_min_r2: 0.3  # Single peak→gene training R² threshold before alpha; null disables
  # saturating_hybrid uses singles/supported groups; response families are independent by layer.
  model_mode: saturating_hybrid
  response_model: nn                   # This layer's response: spline | nn | saturation
  # Experimental smoothness=1e-6, not a validated optimum; no per-relationship production CV.
  spline_response:
    smoothness: 1.0e-6
    group_interaction_penalty: 0.01          # Experimental interaction penalty for2/3-input groups
    tail_scale: 0.5
    internal_knots: 2
    max_nfev: 1000
    restarts: 3
    seed: 42
  log_normalize_rna: true                   # RNA uses log1p normalization

  # Independent NN training budget when this layer uses response_model=nn.
  nn_response:
    hidden_width: 4
    epochs: 300
    lr: 0.01
    l2: 0.01
    seed: 42
    restarts: 1                            # NN restarts, independent of saturation starts below

  # Shared two-layer fitting/support settings for saturating_hybrid only.
  saturating_hybrid:
    workers: 24                            # Target process count for all fitting stages
    max_nfev: 500                           # Solver budget for saturation responses only
    budget_exhausted_policy: best_finite    # Retain valid finite candidates after saturation budget exhaustion
    det_starts: 3                          # Deterministic saturation starts, independent of NN restarts
    rna_cap_lambda: 0.25                   # Expand RNA output cap by this fraction of WT span
    min_fit_rows: 12                        # Minimum single-response supported rows; local TF-lag evidence uses up to12 nearest rows (engineering neighborhood, not biologically validated)
    group_sizes: [2, 3]
    max_groups: 2
    polynomial_degree: 2
    ridge: 0.1
    min_group_rows: 24
    min_group_cell_ess: 30.0
    min_query_cell_ess: 10.0
    min_group_effective_rows: 12.0
    max_geometry_condition: 10000.0
    support_radius_quantile: 0.95
    min_penalized_gain: 0.05
    restart_prediction_spread_max: 0.05
    query_neighbors: 10

# ==================== RNA→ATAC responses and regulatory edges ====================
rna_to_atac:
  response_model: spline                   # This layer's independent response: spline | nn | saturation
  spline_response:
    smoothness: 1.0e-6                     # Experimental default, not a validated optimum
    group_interaction_penalty: 0.01          # Interaction penalty for2/3-input groups
    tail_scale: 0.5
    internal_knots: 2
    max_nfev: 1000
    restarts: 3
    seed: 42
  # Used only for response_model=nn; current spline setting retains this for comparisons.
  nn_response:
    hidden_width: 4
    epochs: 300
    lr: 0.01
    l2: 0.01
    seed: 42
    restarts: 1
  motif_db: "jaspar2024"
  motif_scan_workers: 24                    # Processes for missing motif scans
  motif_pval_threshold: 0.1                 # Motif candidate screening threshold
  max_tfs_per_peak: 5
  tf_peak_pvalue_threshold: 0.05            # TF→peak Pearson screening threshold, not perturbation significance
  min_abs_contribution: 0.01                # Minimum |weight| × std(X)
  tf_expression_filter: true               # Check TF presence in the RNA matrix
  time_lag: true                           # Test nearby WT evidence per target bin; select first supported lag
  max_lag: "auto"                          # Lookback limit only, without truncating early bins; auto/0/negative uses n_bins//4

# ==================== Perturbation propagation and aggregation ====================
perturbation:
  knockout_type: "gene"                     # gene | peak
  perturbation_mode: "bin_forward"
  joint_knockout: true                      # Joint KO of all targets; false runs each separately
  ko_strength: 1.0                         # 1.0 means complete KO
  propagation_rounds: 1
  subnetwork_depth: unlimited
  subnetwork_unlimited_max_edges: 250000    # Maximum final simulation edges
  subnetwork_unlimited_max_work_edges: 250000  # Maximum candidate rows visited during closure traversal
  min_r2_threshold: 0.3                    # Minimum training R² for the combined complete gene model
  min_lag_per_peak_filter: true             # Compare actual supported lags per peak/bin; never renormalize alpha
  log_accumulation: true                    # Accumulate in log1p space; false is the historical raw route
  min_delta_threshold: 0                    # Output |log2FC| threshold; implementation retains at least1e-6 even at0
  atac_significance_zscore: 2.0             # ATAC change / WT between-bin SD
  aggregation_policy: valid_cell_means      # Cell-count-weight WT/KO means over the same valid cells, then compute log2 ratio
  cell_projection:
    enabled: true                          # Enable RNA reference projection
    n_components: null                     # Retain all estimable PCA components
    n_neighbors: 20
    history_delta_threshold: 1.0e-8        # Nonzero threshold for sparse history changes
    state_unit: rna_log1p_cp10k
  # Read this block only for knockout_type=peak, without target_genes.
  peak_ko:
    peak_id: "chr3:34,691,323–34,693,322"
    mode: relative                         # relative: A'=A(1+s); absolute: A'=s
    strength: -1.0                         # -1 closes completely, +1 enhances
    state: "all"                           # Cluster label or all
    depth: 2                               # 1 direct targets;2/3 cascade propagation
    match: overlap                         # exact | overlap | nearest

# ==================== Parallel screening and simulation ====================
execution:
  granger_workers: 24                        # Step4 candidate-test processes;1 is serial
  local_lag_workers: 24                      # Step6 local-lag Pearson processes;1 is serial
  defer_cluster_simulation: true            # Start simulation queue after all cluster training finishes
  simulation_workers: 4                     # Maximum concurrent clusters, positive integer; use1 when memory is limited

# ==================== Outputs and caches ====================
output:
  dir: "results/example/"
  cache_dir: "cache/"
  checkpoint_dir: null                     # null uses output.dir/checkpoints
  export_details: true                    # false summaries; true adds diagnostics, attributions, responses and projection history/events
  save_intermediate: true
